name: builder-image

on:
  workflow_call:
    outputs:
      digest:
        value: ${{ jobs.build.outputs.digest }}
  workflow_dispatch:

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository }}/builder

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: builder
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: hadolint
        run: nix develop path:. -c hadolint builder/Dockerfile

      - name: trufflehog
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          nix develop path:. -c trufflehog docker --image "${IMAGE}@${DIGEST}" --fail --json | tee trufflehog.json

      - name: ssh-audit
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          ssh-keygen -q -t ed25519 -N "" -f "$RUNNER_TEMP/k"
          docker run -d --rm --name builder -p 127.0.0.1:3083:22 --security-opt no-new-privileges \
            "${IMAGE}@${DIGEST}" "$(cat "$RUNNER_TEMP/k.pub")"
          for _ in $(seq 1 30); do ssh-keyscan -p 3083 127.0.0.1 >/dev/null 2>&1 && break; sleep 1; done
          nix develop path:. -c ssh-audit -p 3083 127.0.0.1 | tee ssh-audit.txt || true
          docker stop builder

      - name: BuildKit attestations
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --format '{{json .Provenance}}' | head -c 2000; echo
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --format '{{json .SBOM}}' | head -c 1000; echo

      - name: Summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### builder image"
            echo
            echo "\`${IMAGE}@${DIGEST}\` — attested; the lane will accept it on the next run."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: builder-image-reports
          path: |
            trufflehog.json
            ssh-audit.txt
          if-no-files-found: ignore
