name: verify

on:
  workflow_call:
    inputs:
      attest:
        type: boolean
        default: false
    outputs:
      decision:
        description: clean | review
        value: ${{ jobs.verify.outputs.decision }}

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      decision: ${{ steps.decide.outputs.decision }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OWNER: ${{ github.repository_owner }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Checksums
        run: cd artifacts/dist && sha256sum -c SHA256SUMS

      - name: Attestations
        if: inputs.attest
        run: |
          cd artifacts/dist
          common=(--owner "$OWNER" --signer-workflow "${REPO}/.github/workflows/build-attest.yml"
                  --source-digest "$SHA" --deny-self-hosted-runners)
          for f in app-x86_64-linux app-image-x86_64-linux.tar.gz SHA256SUMS; do
            gh attestation verify "$f" "${common[@]}" >/dev/null && echo "provenance ok: $f"
          done
          gh attestation verify app-x86_64-linux "${common[@]}" --format json > ../../verification.provenance.json
          gh attestation verify app-x86_64-linux "${common[@]}" --bundle app.provenance.sigstore.json >/dev/null && echo "offline bundle ok"
          gh attestation verify app-x86_64-linux "${common[@]}" --predicate-type https://cyclonedx.org/bom >/dev/null && echo "signed SBOM ok"

      - name: Policy
        if: inputs.attest
        run: |
          printf '{"expected":{"signer_workflow":"https://github.com/%s/.github/workflows/build-attest.yml","source_repo":"github.com/%s"}}\n' "$REPO" "$REPO" > expected.json
          nix develop path:. -c conftest test verification.provenance.json -p policy/provenance.rego -n provenance -d expected.json

      - name: Tamper test
        if: inputs.attest
        run: |
          cp artifacts/dist/app-x86_64-linux tampered; printf 'x' >> tampered
          if gh attestation verify tampered --owner "$OWNER" 2>/dev/null; then echo "::error::tampered binary verified"; exit 1; fi
          echo "tampered binary correctly rejected"

      - name: Decision
        id: decide
        run: |
          f=artifacts/reports/reports/findings.json
          any="$(jq -r '[.[] | to_entries[] | .value] | any(. > 0)' "$f")"
          [ "$any" = "true" ] && decision=review || decision=clean
          echo "decision=$decision" | tee -a "$GITHUB_OUTPUT"
          { echo "### verification: integrity passed; findings=\`$any\` → **$decision**"; echo; echo '```'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: VSA
        env:
          DECISION: ${{ steps.decide.outputs.decision }}
        run: |
          set -euo pipefail
          mkdir -p vsa; d=artifacts/dist
          [ "$DECISION" = clean ] && result=PASSED || result=FAILED
          bash .github/scripts/vsa.sh "$result" app-x86_64-linux \
            "https://github.com/${REPO}/.github/workflows/verify.yml" "https://github.com/${REPO}/tree/${SHA}/policy" \
            "$d/app.provenance.sigstore.json" "$d/app.nix-provenance.sigstore.json" "$d/app.sbom.sigstore.json" \
            | tee vsa/app-x86_64-linux.vsa.json

      - if: inputs.attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/dist/app-x86_64-linux
          predicate-type: https://slsa.dev/verification_summary/v1
          predicate-path: vsa/app-x86_64-linux.vsa.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification
          path: |
            vsa/
            verification.provenance.json
          if-no-files-found: ignore
