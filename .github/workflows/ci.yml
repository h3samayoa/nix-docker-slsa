name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  hygiene:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      rebuild: ${{ steps.decide.outputs.rebuild }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: nix develop path:. -c zizmor --offline --min-severity medium .github/
      - run: nix develop path:. -c actionlint -ignore 'specifying action "\$/' -ignore 'reusable workflow call "\$/'
      - run: nix develop path:. -c hadolint builder/Dockerfile
      - run: nix develop path:. -c shellcheck .github/scripts/*.sh builder/entrypoint.sh
      - run: nix flake show --all-systems path:. >/dev/null
      - run: nix fmt -- --check ./*.nix
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          IMAGE: ghcr.io/${{ github.repository }}/builder
        run: |
          rebuild=false
          if [ "$EVENT" = push ]; then
            if ! git diff --quiet HEAD~1 HEAD -- builder/ .github/workflows/build-image.yml 2>/dev/null \
               || ! docker buildx imagetools inspect "${IMAGE}:latest" >/dev/null 2>&1; then rebuild=true; fi
          fi
          echo "rebuild=$rebuild" | tee -a "$GITHUB_OUTPUT"

  build-image:
    needs: hygiene
    if: needs.hygiene.outputs.rebuild == 'true'
    uses: $/.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  build:
    needs: [hygiene, build-image]
    if: ${{ !cancelled() && needs.hygiene.result == 'success' && (needs.build-image.result == 'success' || needs.build-image.result == 'skipped') }}
    uses: $/.github/workflows/build-attest.yml
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write
    with:
      attest: ${{ github.ref == 'refs/heads/main' }}
      builder-digest: ${{ needs.build-image.outputs.digest }}

  verify:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    uses: $/.github/workflows/verify.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      attest: ${{ github.ref == 'refs/heads/main' }}

  security:
    needs: verify
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: {}
    env:
      DECISION: ${{ needs.verify.outputs.decision }}
    steps:
      - run: |
          [ "$DECISION" = clean ] || { echo "::error::security findings: merge blocked; release requires reviewer approval"; exit 1; }

  comment:
    needs: verify
    if: ${{ github.event_name == 'pull_request' && !cancelled() && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      DECISION: ${{ needs.verify.outputs.decision }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reports
      - name: Comment
        run: |
          remote="$(grep -c "on 'ssh://builder'" build.log || true)"
          {
            echo "### verify → **${DECISION}**"
            [ "$DECISION" = clean ] || echo "Merge is blocked by the \`security\` check. A release from this commit requires a reviewer's approval with a reason (\`release\` environment)."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| binary | $(cut -d: -f2- reports/file.txt) |"
            echo "| built on | \`ssh://builder\` (amd64 under QEMU): ${remote} derivations |"
            echo "| builder image | \`$(cat reports/builder-image.txt)\` |"
            echo "| toolchain | $(head -1 reports/buildinfo.txt | cut -d: -f2-) |"
            echo "| SBOMs | $(awk '{printf "%s %s · ", $1, $2}' reports/sbom-counts.txt | sed 's/ · $//') components |"
            echo
            echo '```json'; cat reports/findings.json; echo '```'
            for r in grype.analyzed grype.runtime govulncheck yara-matches; do
              echo "<details><summary>${r}</summary>"; echo; echo '```'; cat "reports/${r}.txt"; echo '```'; echo "</details>"
            done
            echo "<details><summary>checksec</summary>"; echo; echo '```json'; cat reports/checksec.json; echo '```'; echo "</details>"
          } > comment.md
          gh pr comment "$PR" --body-file comment.md --edit-last --create-if-none
