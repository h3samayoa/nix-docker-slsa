version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /builder
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: gomod
    directory: /app
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: golang.org/x/text
